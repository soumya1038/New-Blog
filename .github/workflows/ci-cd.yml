name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint for merge markers
        run: |
          if grep -R --line-number -E "^(<<<<<<<|=======|>>>>>>>)" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "Merge conflict markers detected."
            exit 1
          fi

      - name: Lint JS syntax
        run: |
          find . -path "./node_modules" -prune -o -name "*.js" -print0 | xargs -0 -n 1 node --check

  redirect-build:
    name: Redirect Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: redirect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: redirect/package-lock.json

      - name: Install redirect dependencies
        run: npm ci

      - name: Validate Help Center content and navigation
        run: npm run test:help -- --runInBand

      - name: Build redirect app
        run: npm run build

  backend-smoke:
    name: Backend Smoke
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      PORT: 5000
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/lekhon_ci
      JWT_SECRET: test-jwt-secret-32-characters-long
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      PUBLIC_SITE_URL: http://localhost:3000
      GROQ_API_KEY: ci-groq-key
      CLOUDINARY_CLOUD_NAME: demo
      CLOUDINARY_API_KEY: demo
      CLOUDINARY_API_SECRET: demo
      BREVO_API_KEY: demo
      BREVO_FROM_EMAIL: noreply@example.com
      LIVEKIT_API_KEY: demo
      LIVEKIT_API_SECRET: demo
      LIVEKIT_WS_URL: wss://example.livekit.cloud
      QUEUE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Start backend server
        run: |
          node server.js > backend-smoke.log 2>&1 &
          echo $! > backend-smoke.pid

      - name: Probe health endpoints
        run: |
          for i in {1..45}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health" > /tmp/health.json; then
              break
            fi
            sleep 2
          done

          curl -fsS "http://127.0.0.1:${PORT}/health" | tee /tmp/health.json
          curl -fsS "http://127.0.0.1:${PORT}/ready" | tee /tmp/ready.json
          curl -fsS "http://127.0.0.1:${PORT}/api/admin/health" | tee /tmp/admin-health.json

      - name: Print backend logs on failure
        if: failure()
        run: cat backend-smoke.log || true

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend-smoke.pid ]; then
            kill "$(cat backend-smoke.pid)" || true
          fi
