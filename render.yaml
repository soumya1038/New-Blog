services:
  # Backend API + Redirect frontend (Single Service)
  - type: web
    name: blog-backend
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd backend && npm install
      cd ../redirect && npm install --legacy-peer-deps && npm run build
      mv build ../backend/
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: google_client_id
        sync: false
      - key: google_client_Secret
        sync: false
      - key: GROQ_API_KEY
        sync: false
