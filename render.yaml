services:
  # Backend API + Redirect frontend (single service)
  - type: web
    name: blog-backend
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd backend && npm ci --omit=dev
      cd ../redirect && npm ci --legacy-peer-deps && GENERATE_SOURCEMAP=false npm run build
      mv build ../backend/
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
