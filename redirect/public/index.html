<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/image/lekhon_url.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/image/lekhon_url.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts for Animated Logo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Editorial Typography Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Source+Serif+4:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Lora:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      .oauth-legal-footer {
        width: 100%;
        padding: 12px 16px;
        border-top: 1px solid #d6d4cf;
        background: #f8f6f2;
        color: #2f2f2f;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      .oauth-legal-footer__inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .oauth-legal-footer a {
        color: #7a5a12;
        font-weight: 600;
        text-decoration: none;
      }
      .oauth-legal-footer a:hover {
        text-decoration: underline;
      }

    <title>Lekhon - Modern Platform</title>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <footer class="oauth-legal-footer" aria-label="Legal links for OAuth verification">
      <div class="oauth-legal-footer__inner">
        <span>Lekhon Legal</span>
        <a href="/">Home</a>
        <a href="/privacy-policy.html">Privacy Policy</a>
        <a href="/terms-of-service.html">Terms of Service</a>
